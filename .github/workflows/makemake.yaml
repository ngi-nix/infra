name: makemake

permissions: {}

on: { push: { branches: [ 'main' ] } }

jobs:
  deploy:
    if: github.repository_owner == 'ngi-nix'
    environment: makemake
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      FLAKE_REF_ROOT: github:${{ github.repository }}/${{ github.sha }}
      FLAKE_REF_SHORT: github:${{ github.repository }}/${{ github.sha }}#makemake
      FLAKE_REF_TOPLEVEL: github:${{ github.repository }}/${{ github.sha }}#nixosConfigurations.makemake.config.system.build.toplevel
      SSH_HOST: deploy@makemake.ngi.nixos.org
    steps:
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        name: 'Install Nix'
        with: { extra_nix_config: 'experimental-features = flakes nix-command no-url-literals' }

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printenv SSH_KEY > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "makemake.ngi.nixos.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID4ejRuAQPx6AbuS1u+Q7UUi1TIwkY2S//kjgpBxYNfU" \
            > ~/.ssh/known_hosts

      - name: Build
        # TODO: switch from `nixpkgs-unstable` to `nixpkgs` once
        #       <https://github.com/NixOS/nixpkgs/pull/546399> has landed in nixos
        #       stable.
        run: |
          nix run --inputs-from "$FLAKE_REF_ROOT" nixpkgs-unstable#nixos-rebuild -- build \
            --no-reexec \
            --flake "$FLAKE_REF_SHORT" \
            --build-host "$SSH_HOST" \
            --target-host "$SSH_HOST"

      - name: Difference
        run: |
          ssh "$SSH_HOST" -- \
            "nix build \"$FLAKE_REF_TOPLEVEL\" && nix run --inputs-from \"$FLAKE_REF_ROOT\" nixpkgs#nvd -- diff /run/current-system result"

      - name: Deploy
        # TODO: switch from `nixpkgs-unstable` to `nixpkgs` once
        #       <https://github.com/NixOS/nixpkgs/pull/546399> has landed in nixos
        #       stable.
        run: |
          nix run --inputs-from "$FLAKE_REF_ROOT" nixpkgs-unstable#nixos-rebuild -- switch \
            --no-reexec \
            --elevate=sudo \
            --flake "$FLAKE_REF_SHORT" \
            --build-host "$SSH_HOST" \
            --target-host "$SSH_HOST"
